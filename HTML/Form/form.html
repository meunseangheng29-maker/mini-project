<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <form >
        <!-- text -->
         <label for="">NAME:</label>
         <input type="Name" placeholder="Enter your name" required>
         <br>
         <label for="">AGE-GRUOP:</label>
         <select name="" id="" required>
            <option value=""selected disabled>age range</option>
            <option value="">Under 18 </option>
            <option value="">18-24</option>
            <option value="">25-34</option>
            <option value="">35-54</option>
            <option value="">55+_</option>
         </select>
         <br>
         <!-- password hidden data -->
          <label for="">PASSWORD:</label>
            <input type="password" placeholder="Enter password" required>
         <br>
         <!-- email format -->
          <label for="">EMAIL:</label>
          <input type="email" placeholder="Enter email" required >
          <br>
          <!-- radio can choose only one value -->
           <label for="">GENDER:</label>
           <input type="radio"name="Gender" value="Male" >Male
           <input type="radio"name="Gender" value="Female" >Female
            <br>
            <!-- check box can choose multiple value -->
             <label for="">HOBBIES:</label> <br>
             <input type="checkbox" name="hobby " value="Reading">Reading <br>
             <input type="checkbox" name="hobby " value="Music">Music <br>
             <input type="checkbox" name="hobby " value="Sport">Sport <br>
             <input type="checkbox" name="hobby " value="Travel">Travel <br>
             <br>
             <!-- submit (send data to another language) -->
              <button type="submit">SUBMIT</button>
              <!-- reset data in form -->
               <button type="reset">RESET</button>

    </form>
</body>
</html>
